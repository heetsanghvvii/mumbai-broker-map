<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Mumbai Broker Map</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { --paper: #f5f6f3; --ink: #0e1a24; --ink-2: #4b5a66; --green: #2f9e62; color-scheme: light; }
      @media (prefers-color-scheme: dark) { :root { --paper: #0b141b; --ink: #e9eeec; --ink-2: #a7b4b9; --green: #4cc283; color-scheme: dark; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        background: var(--paper); color: var(--ink); font: 400 16px/1.5 'Helvetica Neue', 'Segoe UI', system-ui, sans-serif; }
      main { max-width: 32ch; }
      h1 { margin: 0 0 8px; font-size: 1.95rem; line-height: 1.1; letter-spacing: -0.03em; }
      p { margin: 0 0 20px; color: var(--ink-2); }
      a { display: inline-block; padding: 10px 18px; border-radius: 999px; background: var(--ink); color: var(--paper);
        font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
